<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowViolet" cx="80%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#b14aed" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#b14aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2de2e6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="termTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11141f"/>
      <stop offset="100%" stop-color="#0c0e16"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#07080d"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- Title -->
  <text x="80" y="150" font-family="JetBrains Mono, monospace" font-weight="800" font-size="74" letter-spacing="-1" fill="#c7d0e0">GHOSTTY <tspan fill="#2de2e6">×</tspan> <tspan fill="#d97757">CLAUDE CODE</tspan></text>

  <!-- Subtitle -->
  <text x="82" y="206" font-family="JetBrains Mono, monospace" font-weight="500" font-size="29" fill="#aab4cc">Theme Visualizer — preview every Ghostty terminal theme</text>

  <!-- Terminal window -->
  <g>
    <rect x="80" y="262" width="1040" height="284" rx="14" fill="url(#termTop)" stroke="#1d2233" stroke-width="1.5"/>
    <!-- titlebar -->
    <rect x="80" y="262" width="1040" height="44" rx="14" fill="#11141f"/>
    <rect x="80" y="292" width="1040" height="14" fill="#11141f"/>
    <circle cx="108" cy="284" r="6.5" fill="#ff5f57"/>
    <circle cx="132" cy="284" r="6.5" fill="#febc2e"/>
    <circle cx="156" cy="284" r="6.5" fill="#28c840"/>
    <text x="600" y="289" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" fill="#8f99b4">claude — dark-ansi</text>

    <!-- terminal content -->
    <text font-family="JetBrains Mono, monospace" font-size="22" xml:space="preserve">
      <tspan x="112" y="350" fill="#2de2e6">❯</tspan><tspan fill="#c7d0e0"> claude</tspan>
      <tspan x="112" y="392" fill="#d97757">✻ Welcome to Claude Code</tspan>
      <tspan x="112" y="430" fill="#9aa4be">  Pick the theme that reads best for you.</tspan>
      <tspan x="112" y="476" fill="#b14aed">●</tspan><tspan fill="#c7d0e0"> Building the perfect terminal palette…</tspan>
      <tspan x="112" y="514" fill="#28c840">✔</tspan><tspan fill="#9aa4be"> same session, recolored by each Ghostty palette</tspan>
    </text>
  </g>

  <!-- byline -->
  <text x="1120" y="598" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="20" fill="#8f99b4">by <tspan fill="#2de2e6">facundogoni.com.ar</tspan></text>

  <!-- scanlines -->
  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
